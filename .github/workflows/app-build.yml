name: App Build

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Review contract harness
        run: pnpm review:harness

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            artifact-name: windows
            os: windows-latest
          - name: macOS
            artifact-name: macos
            os: macos-latest
          - name: Linux
            artifact-name: linux
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux native and maker dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev fakeroot dpkg squashfs-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make distributables
        run: pnpm make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-forge-${{ matrix.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Upload release assets
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-forge-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          assets=()
          duplicate_asset_names=0
          declare -A seen_asset_names=()

          while IFS= read -r -d '' asset; do
            asset_name="$(basename "${asset}")"

            if [[ -n "${seen_asset_names[${asset_name}]:-}" ]]; then
              echo "::error ::Duplicate release asset name '${asset_name}' from '${asset}' and '${seen_asset_names[${asset_name}]}'"
              duplicate_asset_names=1
            else
              seen_asset_names["${asset_name}"]="${asset}"
            fi

            assets+=("${asset}")
          done < <(find release-assets -type f -print0 | sort -z)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in downloaded build artifacts" >&2
            exit 1
          fi

          if [ "${duplicate_asset_names}" -ne 0 ]; then
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
